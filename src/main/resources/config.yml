# ===== MapEdit 配置 =====
# Web 服务（P1 起生效）
web:
  # 监听端口
  port: 35565
  # 对外 URI：仅用于游戏内拼接链接发给玩家，可配成域名/反向代理地址
  uri: "http://localhost:35565/"
  # 监听 IP；0.0.0.0 监听所有网卡
  bind: 127.0.0.1
  # 访问路径前缀（如 /mapedit，默认空=根路径）；改这里即可子路径访问，反代可原样透传
  path: ""
  # 临时 token 有效期（秒）；网页活跃时心跳自动续期
  token-ttl-seconds: 600
